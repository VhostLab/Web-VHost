name: Build y despliegue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menos privilegios de los que da por defecto: el workflow solo lee el codigo.
permissions:
  contents: read

# Si se empujan dos commits seguidos a main, no queremos dos despliegues
# pisandose. El ultimo gana y el anterior se cancela.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node 22 para igualar el Dockerfile con el que Coolify construye la
      # imagen. Si aqui compila, alli tambien.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # astro check valida tipos y el esquema de las entradas del blog: una
      # fecha mal puesta o un campo que falte se cazan aqui, no en produccion.
      - name: Verificar tipos y contenido
        run: npm run check

      - name: Compilar el sitio
        run: npm run build

      # Red de seguridad: una build puede terminar sin error y dejar dist/ a
      # medias. Si falta la home o el sitemap, no se despliega.
      - name: Comprobar la salida
        run: |
          test -f dist/index.html || { echo "falta dist/index.html"; exit 1; }
          test -f dist/sitemap-index.xml || { echo "falta el sitemap"; exit 1; }
          echo "paginas generadas: $(find dist -name '*.html' | wc -l)"

  deploy:
    name: Desplegar en Coolify
    needs: build
    # Solo en push a main: las pull requests se quedan en la verificacion.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Historial completo: el paso de IndexNow compara este push con el
      # anterior para saber que paginas han cambiado.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Usamos el webhook manual de Coolify, no su API. La API filtra por IP
      # (Settings -> API -> Allowed IPs) y las de los runners de GitHub no
      # estan en la lista, asi que devolvia 403. El endpoint de webhook no
      # tiene ese filtro: es el mismo que ya usan los demas proyectos.
      #
      # La diferencia con el autodespliegue normal de Coolify es cuando se
      # llama: alli GitHub avisa en cada push, aqui solo si la build ha
      # pasado, que es justo la garantia que buscabamos.
      - name: Avisar a Coolify
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
        run: |
          # Un secreto que falta tiene que romper el job: si se saltase en
          # verde, main parecería desplegada sin haberlo hecho nunca.
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::Faltan COOLIFY_WEBHOOK_URL o COOLIFY_WEBHOOK_SECRET."
            exit 1
          fi

          # Coolify espera un evento push con la forma que manda GitHub; con
          # un cuerpo minimo el manejador revienta con un 500.
          payload=$(jq -nc \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{
              ref: $ref,
              before: "0000000000000000000000000000000000000000",
              after: $sha,
              repository: {
                id: 1,
                full_name: $repo,
                name: ($repo | split("/")[1]),
                html_url: ("https://github.com/" + $repo),
                clone_url: ("https://github.com/" + $repo + ".git"),
                default_branch: "main"
              },
              pusher: { name: "github-actions" },
              head_commit: { id: $sha, message: "deploy tras build correcta", added: [], removed: [], modified: [] },
              commits: []
            }')

          # La firma va sobre los bytes exactos que se envian.
          firma=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.*= *//')

          codigo=$(curl --silent --show-error --output respuesta.txt \
            --write-out '%{http_code}' \
            --request POST "$WEBHOOK_URL" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --header "X-Hub-Signature-256: sha256=$firma" \
            --data "$payload")

          echo "HTTP $codigo"
          echo "respuesta: $(head -c 500 respuesta.txt)"

          case "$codigo" in
            2*) echo "despliegue encolado en Coolify" ;;
            401|403) echo "::error::Coolify rechaza la firma ($codigo). Revisa COOLIFY_WEBHOOK_SECRET contra el secreto del webhook de GitHub en Coolify."; exit 1 ;;
            *)   echo "::error::Coolify respondio $codigo."; exit 1 ;;
          esac

      # IndexNow: le dice a Bing (y a Yandex, Seznam...) que URLs han cambiado
      # para que las rastree ya, sin esperar a leer el sitemap. La clave vive en
      # public/indexnow.txt; es publica por diseno, solo demuestra que el host
      # es nuestro. Si esto falla la web ya esta desplegada, asi que no rompe
      # el job.
      - name: Avisar a Bing (IndexNow)
        continue-on-error: true
        env:
          ANTES: ${{ github.event.before }}
        run: |
          # ponytail: solo se avisan los posts y las paginas tocadas. Un cambio
          # en componentes o en src/data no se avisa; Bing lo recoge por el
          # sitemap en su siguiente pasada.
          rutas=$(git diff --name-only "$ANTES" "$GITHUB_SHA" -- src/content/blog src/pages \
            | { grep -vE '\[|/404\.astro$|/api/' || true; } \
            | sed -nE \
                -e 's#^src/content/blog/(.+)\.md$#/blog/\1/#p' \
                -e 's#^src/pages/(.*)index\.astro$#/\1#p' \
                -e 's#^src/pages/(.+)\.astro$#/\1/#p')
          if printf '%s\n' "$rutas" | grep -q '^/blog/.'; then
            rutas=$(printf '%s\n/blog/' "$rutas")
          fi
          rutas=$(printf '%s\n' "$rutas" | sed '/^$/d' | sort -u)

          if [ -z "$rutas" ]; then
            echo "ningun post ni pagina cambiado: nada que avisar"
            exit 0
          fi
          echo "URLs a avisar:"; echo "$rutas"

          # ponytail: el webhook de Coolify solo encola el despliegue, asi que
          # esperamos a que la version nueva este en vivo con un margen fijo.
          # Si el build tardase mas, Bing leeria la version anterior y la
          # corregiria en su siguiente pasada. Si Coolify llega a exponer el
          # SHA desplegado, cambiar esto por un sondeo de ese SHA.
          sleep 180

          clave=$(tr -d '[:space:]' < public/indexnow.txt)
          payload=$(printf '%s\n' "$rutas" | jq -Rnc --arg clave "$clave" '{
            host: "vhost.tech",
            key: $clave,
            keyLocation: "https://vhost.tech/indexnow.txt",
            urlList: [inputs | "https://vhost.tech" + .]
          }')

          codigo=$(curl --silent --show-error --output respuesta.txt \
            --write-out '%{http_code}' \
            --request POST https://api.indexnow.org/indexnow \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "$payload")

          echo "HTTP $codigo"
          case "$codigo" in
            200|202) echo "IndexNow aceptado" ;;
            *) echo "::warning::IndexNow respondio $codigo: $(head -c 300 respuesta.txt)" ;;
          esac
