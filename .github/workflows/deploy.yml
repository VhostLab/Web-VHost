name: Build y despliegue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menos privilegios de los que da por defecto: el workflow solo lee el codigo.
permissions:
  contents: read

# Si se empujan dos commits seguidos a main, no queremos dos despliegues
# pisandose. El ultimo gana y el anterior se cancela.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node 22 para igualar el Dockerfile con el que Coolify construye la
      # imagen. Si aqui compila, alli tambien.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # astro check valida tipos y el esquema de las entradas del blog: una
      # fecha mal puesta o un campo que falte se cazan aqui, no en produccion.
      - name: Verificar tipos y contenido
        run: npm run check

      - name: Compilar el sitio
        run: npm run build

      # Red de seguridad: una build puede terminar sin error y dejar dist/ a
      # medias. Si falta la home o el sitemap, no se despliega.
      - name: Comprobar la salida
        run: |
          test -f dist/index.html || { echo "falta dist/index.html"; exit 1; }
          test -f dist/sitemap-index.xml || { echo "falta el sitemap"; exit 1; }
          echo "paginas generadas: $(find dist -name '*.html' | wc -l)"

  deploy:
    name: Desplegar en Coolify
    needs: build
    # Solo en push a main: las pull requests se quedan en la verificacion.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Avisar a Coolify
        env:
          WEBHOOK: ${{ secrets.DEPLOY_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # Un secreto que falta tiene que romper el job: si se saltase en
          # verde, main parecería desplegada sin haberlo hecho nunca.
          if [ -z "$WEBHOOK" ]; then
            echo "::error::Falta el secreto DEPLOY_URL (gh secret set DEPLOY_URL)."
            exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secreto COOLIFY_TOKEN (gh secret set COOLIFY_TOKEN)."
            exit 1
          fi

          # Guardamos cuerpo y codigo por separado para poder enseñar la
          # respuesta de Coolify cuando algo falla; sin esto un 401 solo dice
          # "curl: (22)" y no se sabe si es el token o la URL.
          codigo=$(curl --silent --show-error --location --output respuesta.txt \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $TOKEN" \
            --header 'Accept: application/json' \
            "$WEBHOOK")

          echo "HTTP $codigo"
          echo "respuesta: $(cat respuesta.txt)"

          case "$codigo" in
            2*) echo "despliegue solicitado a Coolify" ;;
            401|403) echo "::error::Coolify rechaza el token ($codigo). Revisa COOLIFY_TOKEN: tiene que ser un token de API de Coolify, no el secreto del webhook de GitHub."; exit 1 ;;
            404) echo "::error::Coolify no encuentra el recurso ($codigo). Revisa el uuid de DEPLOY_URL."; exit 1 ;;
            *)   echo "::error::Coolify respondio $codigo."; exit 1 ;;
          esac
