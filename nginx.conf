server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de nginx en la cabecera Server. No arregla ningún
    # fallo, pero le ahorra a un escáner el trabajo de saber contra qué versión
    # tirar sus exploits.
    server_tokens off;

    # Redirecciones relativas: "Location: /blog/" en vez de "Location:
    # http://vhost.tech/blog/".
    #
    # nginx redirige solo cuando falta la barra final, y para componer esa URL
    # absoluta se inventa el esquema y el puerto a partir de su propio listen,
    # que aquí es un 80 sin TLS. Detrás del proxy que termina el HTTPS eso
    # significa mandar a los clientes de https a http, y que el proxy tenga que
    # devolverlos a https: dos saltos y una bajada de protocolo por el camino.
    #
    # Un navegador ni se entera, pero un cliente que se niega a bajar de
    # protocolo —los que generan las vistas previas de enlaces, por ejemplo— ve
    # un fallo o un bucle, y el enlace se queda sin previsualización.
    #
    # Con la redirección relativa, el cliente la resuelve contra la URL que ya
    # tenía y conserva esquema y puerto sin que nginx tenga que adivinarlos.
    absolute_redirect off;

    # Página 404 real de Astro
    error_page 404 /404.html;

    # --- Cabeceras comunes -------------------------------------------------
    #
    # OJO con add_header en nginx: un location que declara sus propias
    # cabeceras NO hereda las del server. Por eso este bloque está repetido
    # dentro de cada location que añade alguna. Si tocas una, tócalas todas.
    #
    # Sobre la CSP: la web emite scripts en línea (Astro los genera para sus
    # directivas de cliente), así que script-src necesita 'unsafe-inline' y no
    # puede frenar un onerror inyectado. Lo que sí aporta es cerrar el resto de
    # la superficie: nada de scripts de terceros no listados, nada de <base>
    # ajeno, nada de formularios hacia fuera, nada de plugins, y sobre todo
    # frame-ancestors 'none', que es la defensa real contra el clickjacking.
    #
    # img-src va a https: abierto a propósito: las fichas de juegos traen
    # carátulas de Steam, Microsoft y otros, y acotarlas por dominio se rompería
    # cada vez que se añade un juego.
    #
    # connect-src abarca *.vhost.tech porque el navegador del visitante habla
    # con varios subdominios propios: analytics para las visitas y n1/n2/n3 para
    # el medidor de latencia de las páginas de tienda. Y con discord.com, que es
    # de donde sale el contador de gente conectada.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.vhost.tech; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.vhost.tech https://discord.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # Descubrimiento para agentes (RFC 8288): dice desde la cabecera dónde está
    # lo legible por máquina, sin tener que descargar y mirar el HTML.
    #
    # Solo se anuncia lo que existe: mandar a un agente a un /.well-known/ que
    # devuelve 404 es peor que no decirle nada.
    #
    # Con "always" para que la pista siga estando en el 404, que es justo donde
    # un agente perdido la necesita.
    add_header Link '</llms.txt>; rel="describedby"; type="text/plain"' always;
    add_header Link '</sitemap-index.xml>; rel="index"; type="text/xml"' always;

    # Nada de ficheros ocultos, con la excepción de /.well-known/, que es
    # público por diseño. Hoy el build no genera ninguno más, pero basta con que
    # un día se cuele un .env o un .git en public/ para servirlo tal cual.
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # El catálogo ARD lo leen agentes desde otro origen, así que necesita CORS.
    # Solo este archivo: es público por definición y no dice nada que no esté ya
    # en la web. El resto del sitio se queda sin CORS, como estaba.
    location = /.well-known/ai-catalog.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Los assets de Astro llevan hash en el nombre: cache inmutable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
